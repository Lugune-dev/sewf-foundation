
services:
  - type: web
    name: sewf-foundation
    runtime: docker
    plan: free
    repo: https://github.com/Lugune-dev/sewf-foundation
    branch: main

    envVars:
      - key: WORDPRESS_DB_HOST
        sync: false

      - key: WORDPRESS_DB_PORT
        sync: false

      - key: WORDPRESS_DB_USER
        sync: false

      - key: WORDPRESS_DB_PASSWORD
        sync: false

      - key: WORDPRESS_DB_NAME
        sync: false

      - key: WORDPRESS_DB_SSL
        value: "true"

      - key: WORDPRESS_DEBUG
        value: "true"

      - key: WORDPRESS_CONFIG_EXTRA
        value: "define('WP_HOME', 'https://sewf-foundation.onrender.com'); define('WP_SITEURL', 'https://sewf-foundation.onrender.com');"
